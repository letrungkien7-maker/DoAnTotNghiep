name: Keep Backend Alive

on:
  schedule:
    # Runs every 12 minutes to prevent Render free tier from sleeping (sleeps after 15m)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-backend:
    name: Ping Healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Sending keep-alive ping to Render backend..."
          response=$(curl -s -w "\nHTTP_STATUS: %{http_code}\n" "https://real-estate-backend-5l9s.onrender.com/api/v1/health")
          echo "$response"
