databases:
  - name: real-estate-db
    databaseName: real_estate_db
    user: postgres
    plan: free
    region: singapore

services:
  # Backend FastAPI Web Service
  - type: web
    name: real-estate-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt && alembic upgrade head && python -m app.scripts.seed_demo_data"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: real-estate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: real-estate-frontend
          property: host

  # Frontend Vite React Static Site
  - type: web
    name: real-estate-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: real-estate-backend
          property: host
      - key: VITE_API_V1_PREFIX
        value: "/api/v1"
